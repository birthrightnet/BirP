name: Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refToBuild:
        description: 'Tag or branch to build'
        type: string
        default: 'develop'

env:
  TAG: ${{ inputs.refToBuild || github.ref_name }}

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ env.TAG }}

    - name: Get commit hash
      id: get_commit
      shell: pwsh
      run: |
        $COMMIT_HASH = git rev-parse HEAD
        Write-Host "Commit hash: $COMMIT_HASH"
        "commit_hash=$COMMIT_HASH" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # Nothing gets built for a tag that is not ready to ship: version files that
    # disagree, a changelog still headed Unreleased, a stale date. On a tag the
    # tag itself already exists, so that one check is relaxed.
    #
    # A manual dispatch is usually a mid-cycle build test, where the changelog is
    # meant to be uncurated. There the check reports and does not block.
    - name: Check release readiness
      id: readiness
      shell: pwsh
      continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: |
        ./scripts/check-release-readiness.ps1 -AllowExistingTag
        exit $LASTEXITCODE

    - name: Setup Open Watcom
      uses: open-watcom/setup-watcom@v0
      with:
        version: "2.0"

    # build-release-package.ps1 compiles the installer with iscc, which is not
    # present on the runner by default. Same step as installer-tests.yml.
    - name: Install Inno Setup
      shell: powershell
      run: |
        choco install innosetup -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }

    - name: Download UASM
      shell: powershell
      run: |
        $url = "https://www.appypedia.com/h/uasm257_x64.zip"
        Write-Host "Downloading UASM from $url"
        Invoke-WebRequest -Uri $url -OutFile "uasm.zip"
        Expand-Archive -Path "uasm.zip" -DestinationPath "..\UASM" -Force

    # The bundle carries RES, Patch1004, and the DirectX SDK. Without it the build
    # fails much later as a missing-header error, so stop here instead of warning.
    - name: Download birp-dependencies
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $url = "https://www.appypedia.com/h/birp-dependencies.zip"
        Write-Host "Downloading birp-dependencies from $url"
        Invoke-WebRequest -Uri $url -OutFile "birp-dependencies.zip"

    - name: Extract birp-dependencies
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Expand-Archive -Path "birp-dependencies.zip" -DestinationPath "..\BirP-Dependencies" -Force

    - name: Setup Project Dependencies
      shell: powershell
      run: |
        $uasmRoot = Resolve-Path "..\UASM"
        $depsRoot = Resolve-Path "..\BirP-Dependencies"
        
        # Add UASM to PATH safely
        if (Test-Path $uasmRoot) {
            Add-Content -Path $env:GITHUB_PATH -Value $uasmRoot
        }

        # Append project-specific INCLUDEs
        $extraIncludes = @(
            Join-Path $depsRoot "Windows95DDK\INC32"
            Join-Path $depsRoot "Windows95DDK\INC16"
            Join-Path $depsRoot "Windows95DDK-INC16-DIGITALV"
            Join-Path $depsRoot "DirectXSDK\sdk\inc"
            Join-Path $env:WATCOM "h\nt\directx"
            Join-Path $env:WATCOM "h\nt\ddk"
        ) | Where-Object { Test-Path $_ }
        
        if ($extraIncludes.Count -gt 0) {
            $currentInclude = if ([string]::IsNullOrWhiteSpace($env:INCLUDE)) { @() } else { $env:INCLUDE -split ';' }
            $newInclude = ($currentInclude + $extraIncludes) -join ';'
            Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$newInclude"
        }

        # Append project-specific LIBs
        $extraLibs = @(
            Join-Path $depsRoot "Windows95DDK\LIB"
            Join-Path $depsRoot "DirectXSDK\sdk\lib"
        ) | Where-Object { Test-Path $_ }
        
        if ($extraLibs.Count -gt 0) {
            $currentLib = if ([string]::IsNullOrWhiteSpace($env:LIB)) { @() } else { $env:LIB -split ';' }
            $newLib = ($currentLib + $extraLibs) -join ';'
            Add-Content -Path $env:GITHUB_ENV -Value "LIB=$newLib"
        }

        # Set game install dir for build scripts
        Add-Content -Path $env:GITHUB_ENV -Value "BIRTHRT_INSTALL_DIR=C:\SIERRA\BIRTHRT"

    - name: Build Release Package
      shell: powershell
      run: |
        # Ensure build-artifacts directories exist
        New-Item -ItemType Directory -Path "build-artifacts\binaries\Installer" -Force | Out-Null
        ./scripts/build-release-package.ps1

    # Install what was just built and check the game files land. The installer
    # suite proves the installer's logic against stand-in payloads; this proves
    # the actual package, and catches one built from the wrong commit.
    - name: Smoke test the release package
      shell: powershell
      run: |
        ./scripts/smoke-test-release-package.ps1
        exit $LASTEXITCODE

    - name: Upload smoke test workspace on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: release-smoke-workspace
        path: build-artifacts/release-smoke/*.log
        if-no-files-found: ignore

    # The release notes are the changelog section that was already curated. This
    # is the only place they get written, so there is never a second, divergent
    # list to keep in step.
    - name: Build release notes
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        ./scripts/get-release-notes.ps1 -Version "${{ env.TAG }}" -OutFile "release-notes.md"
        exit $LASTEXITCODE

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: birp-release-${{ env.TAG }}
        path: |
          build-artifacts/binaries/Installer/Birthrt-*.exe
          build-artifacts/binaries/Installer/Birthrt-*.zip

    # Tag pushes only. A manual dispatch names a branch, and this action would
    # create a tag with that name and a release to match. Dispatch runs still
    # build and upload the artifacts above, which is enough to test the build.
    - name: Update Release
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "build-artifacts/binaries/Installer/*.exe,build-artifacts/binaries/Installer/*.zip"
        tag: ${{ env.TAG }}
        commit: ${{ steps.get_commit.outputs.commit_hash }}
        name: "📦 Release ${{ env.TAG }}"
        bodyFile: "release-notes.md"
        draft: true
        allowUpdates: true
        replacesArtifacts: true
        # Never flip an already published release back to draft on a re-run.
        omitDraftDuringUpdate: true
        # Nor overwrite notes someone has since edited by hand. To refresh them
        # from the changelog, run:
        #   gh release edit <tag> --notes-file release-notes.md
        omitBodyDuringUpdate: true
